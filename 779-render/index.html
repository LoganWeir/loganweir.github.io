<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>779 / Revision 06</title>
        <link rel="icon" href="data:," />
        <style>
            :root {
                color-scheme: light;
                --paper: #f3efe5;
                --ink: #29392f;
                --muted: #656c60;
                --line: #c9c9b8;
                --wood: #873e2b;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: var(--paper);
                color: var(--ink);
                font:
                    15px/1.5 system-ui,
                    sans-serif;
            }
            header,
            main,
            footer {
                max-width: 1800px;
                margin: auto;
                padding-inline: clamp(16px, 3vw, 54px);
            }
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 20px;
                padding-block: 24px;
                border-bottom: 1px solid var(--line);
            }
            h1,
            h2,
            h3 {
                font-family: Georgia, serif;
                font-weight: 400;
            }
            h1 {
                margin: 0;
                font-size: clamp(24px, 3vw, 36px);
                line-height: 1.2;
            }
            h1 span {
                color: var(--muted);
            }
            h2 {
                margin: 0 0 22px;
                font-size: clamp(26px, 3vw, 38px);
            }
            h3 {
                margin: 0 0 14px;
                font-size: 24px;
            }
            nav,
            footer {
                display: flex;
                flex-wrap: wrap;
                gap: 12px 24px;
                font-size: 13px;
            }
            a {
                color: inherit;
                text-underline-offset: 4px;
                text-decoration-thickness: 1px;
            }
            a:hover {
                color: var(--wood);
            }
            a:focus-visible {
                outline: 2px solid var(--wood);
                outline-offset: 5px;
            }
            section {
                padding-block: 36px;
                scroll-margin-top: 20px;
            }
            section + section {
                border-top: 1px solid var(--line);
            }
            .gallery,
            .pair {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 30px 24px;
                align-items: start;
            }
            figure {
                min-width: 0;
                margin: 0;
            }
            figure a {
                display: block;
            }
            img {
                display: block;
                width: 100%;
                height: auto;
                background: #ded7c8;
            }
            figcaption {
                margin-top: 9px;
                font-size: 13px;
                color: var(--muted);
            }
            .wide {
                grid-column: 1 / -1;
            }
            .comparison + .comparison {
                margin-top: 36px;
            }
            footer {
                border-top: 1px solid var(--line);
                padding-block: 24px;
                color: var(--muted);
            }
            @media (max-width: 760px) {
                header {
                    align-items: flex-start;
                    flex-direction: column;
                    gap: 16px;
                }
                nav {
                    gap: 12px 20px;
                }
                .gallery,
                .pair {
                    grid-template-columns: minmax(0, 1fr);
                    gap: 24px;
                }
                section {
                    padding-block: 28px;
                }
            }
            @media print {
                figure {
                    break-inside: avoid;
                }
            }
        </style>
    </head>
